name: Statistika

on:
  schedule:
    - cron: "17 5 * * *"   # hər gün ~09:17 Bakı
  push:
    branches: [main]
    paths: ["stats/request.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: stats

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Statistikanı topla
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
        run: python3 .github/scripts/stats.py
      - name: Yadda saxla
        run: |
          git config user.name "bumerang-studio"
          git config user.email "bumerang.studio.az@gmail.com"
          git add stats/latest.json stats/history.csv
          git diff --cached --quiet || (git commit -m "Statistika [skip ci]" && git pull --rebase -q && git push)
