name: Reels paylaş

on:
  push:
    branches: [main]
    paths: ["reels/*/post.json"]
  workflow_dispatch:
    inputs:
      slug:
        description: "reels/ qovluğundakı adı"
        required: true

permissions:
  contents: write

concurrency: publish-reel

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Hansı Reels?
        id: which
        run: |
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            echo "slugs=${{ github.event.inputs.slug }}" >> "$GITHUB_OUTPUT"
          else
            s=$(git diff --name-only HEAD~1 HEAD -- 'reels/*/post.json' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            echo "slugs=$s" >> "$GITHUB_OUTPUT"
          fi
      - name: Instagram + Facebook-a paylaş
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
        run: python3 .github/scripts/publish_reel.py ${{ steps.which.outputs.slugs }}
      - name: Nəticəni yadda saxla
        if: always()
        run: |
          git config user.name "bumerang-studio"
          git config user.email "bumerang.studio.az@gmail.com"
          git add reels/*/result.json || true
          git diff --cached --quiet || (git commit -m "Paylaşım nəticəsi [skip ci]" && git push)
